<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive temple album showcasing temples of The Church of Jesus Christ of Latter-day Saints. Filter by age, size, or browse all temples." />
  <title>Temple Album | WDD 131</title>
  <link rel="stylesheet" href="styles/temples.css" />
  <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 640px)" />
  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

    <nav id="main-nav" aria-label="Temple filter navigation">
      <button id="hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-list">&#9776;</button>
      <ul id="nav-list" role="list">
        <li><a href="#" class="filter-btn active" data-filter="home">Home</a></li>
        <li><a href="#" class="filter-btn" data-filter="old">Old</a></li>
        <li><a href="#" class="filter-btn" data-filter="new">New</a></li>
        <li><a href="#" class="filter-btn" data-filter="large">Large</a></li>
        <li><a href="#" class="filter-btn" data-filter="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <h1 id="gallery-heading">All Temples</h1>
    <section id="temple-gallery" aria-live="polite" aria-label="Temple gallery">
      <!-- Temple cards injected by JavaScript -->
    </section>
  </main>

  <footer>
    <p>&copy; <span id="copyright-year"></span> Temple Album | Worldwide Temples</p>
