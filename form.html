<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a product review for our featured products. Share your experience and help others make informed decisions.">
  <meta name="author" content="Student Name">
  <title>Product Review Form | WDD131</title>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Product Review</h1>
      <p class="tagline">Share your experience with our products</p>
    </div>
  </header>

  <main>
    <section class="form-wrapper">
      <h2>Write a Review</h2>
      <p class="required-note">Fields marked with <span aria-hidden="true">*</span><span class="sr-only">an asterisk</span> are required.</p>

      <form method="get" action="review.html" novalidate>

        <!-- Product Name -->
        <div class="form-group">
          <label for="product-name">
            Product Name <span class="required-star" aria-hidden="true">*</span>
          </label>
          <select id="product-name" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- Options populated by JavaScript -->
          </select>
        </div>

        <!-- Overall Rating -->
        <fieldset class="form-group rating-group">
          <legend>
            Overall Rating <span class="required-star" aria-hidden="true">*</span>
            <span class="sr-only">(required)</span>
          </legend>
          <div class="stars-container">
            <input type="radio" id="star5" name="rating" value="5" required>
            <label for="star5" title="5 stars – Excellent">&#9733;</label>

            <input type="radio" id="star4" name="rating" value="4" required>
            <label for="star4" title="4 stars – Good">&#9733;</label>

            <input type="radio" id="star3" name="rating" value="3" required>
            <label for="star3" title="3 stars – Average">&#9733;</label>

            <input type="radio" id="star2" name="rating" value="2" required>
            <label for="star2" title="2 stars – Poor">&#9733;</label>

            <input type="radio" id="star1" name="rating" value="1" required>
            <label for="star1" title="1 star – Terrible">&#9733;</label>
          </div>
        </fieldset>

        <!-- Date of Installation -->
        <div class="form-group">
          <label for="install-date">
            Date of Installation <span class="required-star" aria-hidden="true">*</span>
          </label>
          <input
            type="date"
            id="install-date"
            name="installdate"
            required
            aria-required="true"
          >
        </div>

        <!-- Useful Features -->
        <fieldset class="form-group checkbox-group">
          <legend>Useful Features <span class="optional-tag">(select all that apply)</span></legend>
          <div class="checkbox-grid">
            <div class="checkbox-item">
              <input type="checkbox" id="feature-easy" name="features" value="easy-install">
              <label for="feature-easy">Easy Installation</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="feature-reliable" name="features" value="reliable">
              <label for="feature-reliable">Reliable Performance</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="feature-value" name="features" value="value">
              <label for="feature-value">Good Value</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="feature-durable" name="features" value="durable">
              <label for="feature-durable">Durable Build</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="feature-support" name="features" value="support">
              <label for="feature-support">Great Support</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="feature-design" name="features" value="design">
              <label for="feature-design">Sleek Design</label>
            </div>
          </div>
        </fieldset>

        <!-- Written Review -->
        <div class="form-group">
          <label for="written-review">Written Review <span class="optional-tag">(optional)</span></label>
          <textarea
            id="written-review"
            name="review"
            rows="5"
            placeholder="Tell us about your experience..."
          ></textarea>
        </div>

        <!-- User Name -->
        <div class="form-group">
          <label for="username">Your Name <span class="optional-tag">(optional)</span></label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="e.g. Jane D."
            autocomplete="name"
          >
        </div>

        <!-- Submit -->
        <div class="form-group submit-group">
          <input type="submit" value="Submit Review">
        </div>

      </form>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; <span id="current-year"></span> WDD131 &mdash; Product Review | <a href="#">Privacy Policy</a></p>
      <p>Last Modified: <span id="last-modified"></span></p>
    </div>
  </footer>

  <script src="scripts/form.js" defer></script>
</body>
</html>
